name: Validate Repository & Metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Assets & Standards
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Repository Metadata & Snippets
        run: |
          npm test
          echo "Validating JSON configs integrity..."
          node -e "
            const fs = require('fs');
            const files = ['twa-manifest.json', 'configs/dns/is-a-dev-template.json', 'package.json'];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                console.log('✓ Valid JSON:', f);
              }
            });
          "
